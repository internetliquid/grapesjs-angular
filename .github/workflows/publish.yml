name: Publish to npm
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Dependency code runs only in `build`; the write-scoped `publish` job installs nothing.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:lib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: dist/grapesjs-angular
          # The package's .npmignore keeps nested package.json files out of the tarball.
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist/grapesjs-angular
      - name: Detect pre-release
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Any SemVer pre-release identifier (the hyphen) marks a GitHub pre-release
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      # Pre-1.0: the newest release is what consumers should get by default, so
      # every tag publishes to the `latest` dist-tag (npm's default). Revisit once
      # a stable release needs its own pre-release channel — e.g. route betas to
      # `next` and reserve `latest` for stable.
      - run: npm publish ./dist/grapesjs-angular --access public --provenance --tag latest --ignore-scripts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          VERSION="${TAG#v}"
          # Pull this version's section out of CHANGELOG.md (Keep a Changelog format):
          # everything between this "## [x.y.z]" heading and the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for $VERSION — falling back to auto-generated notes."
            FLAGS=(--generate-notes)
          else
            FLAGS=(--notes-file release-notes.md)
          fi
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$TAG" --title "$TAG" --verify-tag "${FLAGS[@]}"
