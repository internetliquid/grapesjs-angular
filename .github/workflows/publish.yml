name: Publish to npm
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:lib
      - name: Detect pre-release
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Any SemVer pre-release identifier (the hyphen) marks a GitHub pre-release
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      # Pre-1.0: the newest release is what consumers should get by default, so
      # every tag publishes to the `latest` dist-tag (npm's default). Revisit once
      # a stable release needs its own pre-release channel — e.g. route betas to
      # `next` and reserve `latest` for stable.
      - run: npm publish ./dist/grapesjs-angular --access public --provenance --tag latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          VERSION="${TAG#v}"
          # Pull this version's section out of CHANGELOG.md (Keep a Changelog format):
          # everything between this "## [x.y.z]" heading and the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for $VERSION — falling back to auto-generated notes."
            FLAGS=(--generate-notes)
          else
            FLAGS=(--notes-file release-notes.md)
          fi
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$TAG" --title "$TAG" --verify-tag "${FLAGS[@]}"
